<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon" />
    <title>Etch a Sketch</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" type="module" defer></script>
  </head>
  <body ondragstart="return false" ondrop="return false">
    <header class="header">
      <h1 class="title">Etch a Sketch</h1>
    </header>
    <main class="main">
      <div class="controls">
        <div id="color-history">
          <span>History:</span>
        </div>
        <hr class="hr" />
        <label for="grid-size-input"
          >Grid Size: <span id="grid-size-span">16 x 16</span></label
        >
        <input
          type="range"
          name="grid-size-input"
          id="grid-size-input"
          value="16"
          min="16"
          max="50"
        />
      </div>
      <div class="canvas"></div>
      <div class="controls">
        <input
          type="color"
          name="color-selector"
          id="color-selector"
          value="#000000"
        />
        <button id="color-btn" class="btn active" type="button">Color</button>
        <button id="rainbow-btn" class="btn">Rainbow</button>
        <button id="erase-btn" class="btn" type="button">Erase</button>
        <button id="clear-btn" class="btn" type="button">Clear</button>
      </div>
    </main>
  </body>
</html>
